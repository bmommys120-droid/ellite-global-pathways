        function AdminSettings() {
            const { data: settings, loading, retry } = useAsyncData(async () => {
                if (!supabaseClient) return [];
                const { data, error } = await supabaseClient.from('site_settings').select('*');
                if (error) throw error;
                return data || [];
            }, []);
            
            const [formData, setFormData] = useState({});
            const [saving, setSaving] = useState(false);
            
            useEffect(() => {
                if (settings) {
                    const obj = {};
                    settings.forEach(s => { obj[s.key] = s.value; });
                    setFormData(obj);
                }
            }, [settings]);
            
            const handleSave = async () => {
                setSaving(true);
                try {
                    if (!supabaseClient) throw new Error('Supabase not initialized');
                    for (const [key, value] of Object.entries(formData)) {
                        const { error } = await supabaseClient.from('site_settings').upsert({ key, value }, { onConflict: 'key' });
                        if (error) throw error;
                    }
                    await retry();
                } catch (err) {
                    console.error('Save error:', err);
                } finally {
                    setSaving(false);
                }
            };
            
            if (loading) {
                return <AdminSection title="Settings" onBack={() => window.location.hash = '#/admin/dashboard'}><p className="text-white/70">Loading...</p></AdminSection>;
            }
            
            const displayKeys = Object.keys(formData).filter(k => !k.startsWith('_')).sort();
            
            return (
                <AdminSection title="Site Settings" onBack={() => window.location.hash = '#/admin/dashboard'}>
                    <div className="max-w-2xl space-y-4">
                        {displayKeys.map(key => (
                            <div key={key}>
                                <label className="block text-sm text-white/70 mb-1">
                                    {key.replace(/_/g, ' ').replace(/\b\w/g, l => l.toUpperCase())}
                                </label>
                                <input 
                                    type="text" 
                                    value={formData[key] || ''} 
                                    onChange={(e) => setFormData({...formData, [key]: e.target.value})} 
                                    className="input-sky" 
                                />
                            </div>
                        ))}
                        <button onClick={handleSave} disabled={saving} className="btn-primary w-full disabled:opacity-50">
                            {saving ? 'Saving...' : 'Save Settings'}
                        </button>
                    </div>
                </AdminSection>
            );
        }

        function AdminModal({ title, children, onClose, onSave, isSubmitting }) {
            return (
                <div className="modal-overlay" role="dialog" aria-modal="true" aria-label={title}>
                    <div className="modal-content">
                        <button className="modal-close" onClick={onClose} aria-label="Close modal">✕</button>
                        <h3 className="text-xl font-bold mb-4">{title}</h3>
                        <div className="space-y-4">
                            {children}
                            <div className="flex gap-3 pt-2">
                                <button onClick={onSave} disabled={isSubmitting} className="flex-1 btn-primary disabled:opacity-50">
                                    {isSubmitting ? 'Saving...' : 'Save'}
                                </button>
                                <button onClick={onClose} className="flex-1 rounded-xl px-6 py-2 border border-white/20 text-white/60 hover:text-white transition-colors">
                                    Cancel
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            );
        }

        function AdminSection({ title, children, onBack }) {
            return (
                <div>
                    <div className="flex items-center gap-4 mb-6">
                        <button onClick={onBack} className="text-white/50 hover:text-white transition-colors">← Back</button>
                        <h1 className="text-2xl font-bold">{title}</h1>
                    </div>
                    {children}
                </div>
            );
        }

        // ─── SMOOTH SCROLL WRAPPER ──────────────────────────────────────
        function SmoothScroll({ children }) {
            const reduced = useReducedMotion();
            
            useEffect(() => {
                if (reduced) return;
                if (typeof Lenis === 'undefined' || typeof gsap === 'undefined') return;
                
                let lenis = null;
                let ticker = null;
                
                try {
                    lenis = new Lenis({
                        duration: 1.2,
                        easing: t => Math.min(1, 1.001 - Math.pow(2, -10 * t)),
                        smoothWheel: true,
                        touchMultiplier: 1.5,
                    });
                    
                    lenis.on('scroll', () => {
                        if (typeof ScrollTrigger !== 'undefined') ScrollTrigger.update();
                    });
                    
                    ticker = (time) => { lenis.raf(time * 1000); };
                    gsap.ticker.add(ticker);
                    gsap.ticker.lagSmoothing(0);
                } catch (err) {
                    console.warn('Lenis init failed:', err);
                }
                
                return () => {
                    if (ticker && typeof gsap !== 'undefined') {
                        gsap.ticker.remove(ticker);
                    }
                    if (lenis) lenis.destroy();
                };
            }, [reduced]);
            
            return children || null;
        }

        // ─── MAIN APP ────────────────────────────────────────────────────
        function App() {
            const [route, setRoute] = useState(window.location.hash);
            const [splashDone, setSplashDone] = useState(false);
            
            useEffect(() => {
                const handler = () => setRoute(window.location.hash);
                window.addEventListener('hashchange', handler);
                return () => window.removeEventListener('hashchange', handler);
            }, []);
            
            const isAdminRoute = route.startsWith('#/admin');
            
            return (
                <ErrorBoundary>
                    <SmoothScroll>
                        {!splashDone && !isAdminRoute && <SplashScreen onComplete={() => setSplashDone(true)} />}
                        
                        {isAdminRoute ? (
                            <AdminLayout />
                        ) : (
                            <>
                                <a href="#main-content" className="skip-link">Skip to main content</a>
                                <Navbar />
                                <main id="main-content">
                                    <ParallaxHero />
                                    <AboutSection />
                                    <Programmes />
                                    <Destinations />
                                    <HowItWorks />
                                    <Support />
                                    <InfoSection 
                                        id="scholarships" 
                                        eyebrow="SCHOLARSHIPS" 
                                        title="Scholarship Opportunities" 
                                        subtitle="Explore tuition-reduction and scholarship options." 
                                        body="We help students identify and apply for scholarship opportunities that match their academic profile and financial needs." 
                                    />
                                    <InfoSection 
                                        id="parents" 
                                        eyebrow="PARENTS" 
                                        title="Information for Parents" 
                                        subtitle="We support families throughout the journey." 
                                        body="We understand that parents play a vital role in educational decisions. Our team provides clear information and ongoing support to help families make informed choices." 
                                    />
                                    <WhyChooseUs />
                                    <InfoSection 
                                        id="partners" 
                                        eyebrow="PARTNERS" 
                                        title="Our Partners" 
                                        subtitle="Collaborating with institutions worldwide." 
                                        body="We work with a network of reputable universities and educational institutions to provide diverse opportunities for students." 
                                    />
                                    <Testimonials />
                                    <FAQ />
                                    <ContactSection />
                                    <ContactForm />
                                </main>
                                <Footer />
                                <WhatsAppFloat />
                            </>
                        )}
                    </SmoothScroll>
                </ErrorBoundary>
            );
        }

        // ─── RENDER ──────────────────────────────────────────────────────
        const rootElement = document.getElementById('root');
        if (rootElement) {
            ReactDOM.render(<App />, rootElement);
        } else {
            console.error('Root element not found');
        }
    </script>
</body>
    </html>
