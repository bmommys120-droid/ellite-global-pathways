    <style>

            opacity: 0;

        @media (prefers-reduced-motion: reduce) {
            .morph-section { opacity: 1; transform: none; filter: none; transition: none; }

    </style>
</head>
<body>
    <div id="root"></div>
    <script type="text/babel">
        const { useState, useEffect, useRef, useContext, createContext, useCallback, useMemo } = React;
        const { createClient } = supabase;

        const supabaseUrl = 'https://vznxhjmsshouygmkqtte.supabase.co';
        const supabasePublishableKey = 'sb_publishable_fIzOcCb1L33uUWOVvl6sRw_3noign_j';
        const supabaseAnonKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZ6bnhoam1zc2hvdXlnbWtxdHRlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc1ODY2NzYsImV4cCI6MjEwMzE2MjY3Nn0.hMhITeSaH1A3mglzFZa9FD88AfXRKRt1pDAWpyjDst0';
        let supabaseClient;
        try {
            supabaseClient = createClient(supabaseUrl, supabasePublishableKey || supabaseAnonKey);
        } catch (err) {
            console.error('Supabase init failed:', err);
            supabaseClient = null;
        }

        const STORAGE_BUCKET = 'elite-media';
        const STORAGE_BASE = supabaseClient ? supabaseClient.storage.from(STORAGE_BUCKET).getPublicUrl('').data.publicUrl : '';

        function resolveStorageUrl(path) {
            if (!path) return null;
            try {
                const { data } = supabaseClient.storage.from(STORAGE_BUCKET).getPublicUrl(path);
                return data.publicUrl;
            } catch (err) {
                console.warn('Error generating storage URL:', err);
                return null;
            }
        }

        function getMediaPublicUrl(asset) {
            if (!asset) return null;
            if (asset.storage_path) {
                const url = resolveStorageUrl(asset.storage_path);
                if (url) return url;
            }
            if (asset.public_url && asset.public_url.startsWith('http')) {
                return asset.public_url;
            }
            return null;
        }

        const defaultMedia = {
            logo: 'https://eliteglobalpathways.com/elite-logo.jpg',
            heroVideo: 'https://eliteglobalpathways.com/hero-homepage.mp4',
            splashVideo: 'https://eliteglobalpathways.com/splash.mp4',
            programmeImages: {},
            destinationImages: {}
        };

        const ScrollContext = createContext(null);
        const useScrollTo = () => useContext(ScrollContext);

        function useReducedMotion() {
            const [reduced, setReduced] = useState(false);
            useEffect(() => {
                const mq = window.matchMedia('(prefers-reduced-motion: reduce)');
                setReduced(mq.matches);
                const handler = (e) => setReduced(e.matches);
                mq.addEventListener('change', handler);
                return () => mq.removeEventListener('change', handler);
            }, []);
            return reduced;
        }

        function ErrorBoundary({ children }) {
            const [hasError, setHasError] = useState(false);
            useEffect(() => {
                const handler = (event) => {
                    if (event.error) {
                        console.error('Global error:', event.error);
                        setHasError(true);
                    }
                };
                window.addEventListener('error', handler);
                window.addEventListener('unhandledrejection', (e) => {
                    if (e.reason) {
                        console.error('Unhandled rejection:', e.reason);
                        setHasError(true);
                    }
                });
                return () => {
                    window.removeEventListener('error', handler);
                    window.removeEventListener('unhandledrejection', handler);
                };
            }, []);
            if (hasError) {
                return (
                    <div className="error-boundary-fallback" role="alert">
                        <h1 className="text-3xl font-bold mb-4">Something went wrong.</h1>
                        <p className="text-white/70 mb-8">The website is still available.</p>
                        <button
                            onClick={() => { setHasError(false); window.location.reload(); }}
                            className="btn-waterfill rounded-full px-8 py-3 text-base font-semibold text-white bg-transparent border border-red"
                        >
                            Reload Website
                        </button>
                    </div>
                );
            }
            return children;
        }

        function useAsyncData(fetcher, deps = []) {
            const [data, setData] = useState(null);
            const [loading, setLoading] = useState(true);
            const [error, setError] = useState(null);
            useEffect(() => {
                let isMounted = true;
                setLoading(true);
                setError(null);
                fetcher().then(result => { if (isMounted) setData(result); }).catch(err => {
                    if (isMounted) { console.error('Async data error:', err); setError(err); }
                }).finally(() => { if (isMounted) setLoading(false); });
                return () => { isMounted = false; };
            }, deps);
            const retry = useCallback(() => {
                setLoading(true);
                setError(null);
                fetcher().then(result => setData(result)).catch(err => { console.error('Retry error:', err); setError(err); }).finally(() => setLoading(false));
            }, [fetcher]);
            return { data, loading, error, retry };
        }

        function MorphSection({ children, className = '', style }) {
            const ref = useRef(null);
            const [visible, setVisible] = useState(false);
            const reduced = useReducedMotion();
            useEffect(() => {
                const el = ref.current;
                if (!el) return;
                if (reduced) { setVisible(true); return; }
                const obs = new IntersectionObserver((entries) => {
                    entries.forEach(entry => {
                        if (entry.isIntersecting) {
                            setVisible(true);
                            obs.unobserve(entry.target);
                        }
                    });
                }, { threshold: 0.2, rootMargin: '0px 0px -50px 0px' });
                obs.observe(el);
                return () => obs.disconnect();
            }, [reduced]);
            return (
                <div ref={ref} style={style} className={`morph-section ${visible ? 'visible' : ''} ${className}`}>
                    {children}
                </div>
            );
        }

        function Reveal({ children, delay = 0, className = '' }) {
            return <MorphSection className={className} style={{ transitionDelay: `${delay}s` }}>{children}</MorphSection>;
        }

        function SectionHeading({ eyebrow, title, subtitle, align = 'center', className = '' }) {
            return (
                <div className={`max-w-4xl ${align === 'center' ? 'mx-auto text-center' : ''} ${className}`}>
                    {eyebrow && <Reveal><p className="mb-4 text-sm font-semibold uppercase tracking-[0.3em] text-sky">{eyebrow}</p></Reveal>}
                    <Reveal delay={0.1}><h2 className="text-4xl md:text-5xl lg:text-6xl font-bold leading-tight text-white">{title}</h2></Reveal>
                    {subtitle && <Reveal delay={0.2}><p className="mt-6 text-lg md:text-xl text-white/70">{subtitle}</p></Reveal>}
                </div>
            );
        }

        function WaterfillButton({ children, className = '', onClick, href, type = 'button', ariaLabel }) {
            const content = <span className="relative z-10">{children}</span>;
            if (href) {
                return (
                    <a href={href} className={`btn-waterfill inline-block ${className}`} onClick={onClick} aria-label={ariaLabel}>
                        {content}
                    </a>
                );
            }
            return (
                <button type={type} className={`btn-waterfill inline-block ${className}`} onClick={onClick} aria-label={ariaLabel}>
                    {content}
                </button>
            );
        }

        function SmoothScroll({ children }) {
            const reduced = useReducedMotion();
            const lenisRef = useRef(null);
            const [scrollTo, setScrollTo] = useState(null);
            useEffect(() => {
                if (reduced) {
                    setScrollTo(() => (target) => {
                        const el = document.querySelector(target);
                        if (el) {
                            const headerOffset = 80;
                            const elementPosition = el.getBoundingClientRect().top;
                            const offsetPosition = elementPosition + window.pageYOffset - headerOffset;
                            window.scrollTo({ top: offsetPosition, behavior: 'auto' });
                        }
                    });
                    return;
                }
                let lenis = null;
                let ticker = null;
                try {
                    if (typeof Lenis !== 'undefined') {
                        lenis = new Lenis({ duration: 1.2, easing: t => Math.min(1, 1.001 - Math.pow(2, -10*t)), smoothWheel: true, touchMultiplier: 1.5 });
                        lenisRef.current = lenis;
                        lenis.on('scroll', () => {
                            if (typeof ScrollTrigger !== 'undefined') ScrollTrigger.update();
                        });
                        ticker = (time) => { lenis.raf(time * 1000); };
                        if (typeof gsap !== 'undefined') {
                            gsap.ticker.add(ticker);
                            gsap.ticker.lagSmoothing(0);
                        }
                    }
                } catch (err) {
                    console.warn('Lenis initialization failed:', err);
                }
                const scrollToFn = (target) => {
                    const el = document.querySelector(target);
                    if (!el) return;
                    const headerOffset = 80;
                    const elementPosition = el.getBoundingClientRect().top;
                    const offsetPosition = elementPosition + window.pageYOffset - headerOffset;
                    if (lenis) {
                        lenis.scrollTo(offsetPosition, { duration: 1.2 });
                    } else if (typeof window !== 'undefined' && 'scrollTo' in window) {
                        window.scrollTo({ top: offsetPosition, behavior: 'smooth' });
                    } else {
                        window.scrollTo(0, offsetPosition);
                    }
                };
                setScrollTo(() => scrollToFn);
                return () => {
                    if (ticker && typeof gsap !== 'undefined') {
                        gsap.ticker.remove(ticker);
                    }
                    if (lenis) lenis.destroy();
                };
            }, [reduced]);
            const effectiveScrollTo = scrollTo || ((target) => {
                const el = document.querySelector(target);
                if (el) {
                    const headerOffset = 80;
                    const elementPosition = el.getBoundingClientRect().top;
                    const offsetPosition = elementPosition + window.pageYOffset - headerOffset;
                    window.scrollTo({ top: offsetPosition, behavior: 'smooth' });
                }
            });
            return (
                <ScrollContext.Provider value={effectiveScrollTo}>
                    {children}
                </ScrollContext.Provider>
            );
        }

        function SplashScreen({ onComplete }) {
            const [show, setShow] = useState(true);
            const reduced = useReducedMotion();
            useEffect(() => {
                if (reduced) { setShow(false); onComplete(); return; }
                const timer = setTimeout(() => {
                    setShow(false);
                    onComplete();
                }, 4000);
                return () => clearTimeout(timer);
            }, [reduced, onComplete]);
            if (!show) return null;
            return (
                <div className="splash-screen" role="presentation" aria-hidden="true">
                    <video className="splash-video" autoPlay muted loop playsInline preload="auto" poster="">
                        <source src={defaultMedia.splashVideo} type="video/mp4" />
                        Your browser does not support the video tag.
                    </video>
                    <div className="splash-content">
                        <img src={defaultMedia.logo} alt="Elite Global Pathways" className="splash-logo" />
                        <p className="splash-tagline">Your Dreams. Our Pathway. Your Global Future.</p>
                    </div>
                </div>
            );
        }

        function Navbar() {
            const [scrolled, setScrolled] = useState(false);
            const [mobileOpen, setMobileOpen] = useState(false);
            const scrollTo = useScrollTo();
            const menuRef = useRef(null);
            const buttonRef = useRef(null);
            useEffect(() => {
                const onScroll = () => setScrolled(window.scrollY > 50);
                window.addEventListener('scroll', onScroll);
                return () => window.removeEventListener('scroll', onScroll);
            }, []);
            useEffect(() => {
                const handleClickOutside = (e) => {
                    if (mobileOpen && menuRef.current && !menuRef.current.contains(e.target) && !buttonRef.current?.contains(e.target)) {
                        setMobileOpen(false);
                    }
                };
                const handleEscape = (e) => { if (e.key === 'Escape') setMobileOpen(false); };
                document.addEventListener('mousedown', handleClickOutside);
                document.addEventListener('keydown', handleEscape);
                return () => {
                    document.removeEventListener('mousedown', handleClickOutside);
                    document.removeEventListener('keydown', handleEscape);
                };
            }, [mobileOpen]);
            const links = [
                { label: 'Home', href: '#home' },
                { label: 'Programmes', href: '#programmes' },
                { label: 'Destinations', href: '#destinations' },
                { label: 'Support', href: '#support' },
                { label: 'How It Works', href: '#how-it-works' },
                { label: 'FAQ', href: '#faq' }
            ];
            const handleNavClick = (e, href) => {
                e.preventDefault();
                scrollTo(href);
                setMobileOpen(false);
                if (window.history) {
                    window.history.pushState(null, '', href);
                }
            };
            return (
                <header className={`navbar-layer fixed top-0 left-0 right-0 z-50 transition-all duration-500 ${scrolled ? 'glass py-3' : 'bg-transparent py-6'}`}>
                    <a href="#main-content" className="skip-link">Skip to main content</a>
                    <div className="mx-auto max-w-7xl flex items-center justify-between px-6 lg:px-8">
                        <a href="#home" className="flex items-center gap-3" onClick={(e) => handleNavClick(e, '#home')} aria-label="Go to home">
                            <img src={defaultMedia.logo} alt="Elite Global Pathways" className="h-10 w-10 rounded-full object-cover" />

        function ParallaxHero() {
            const heroRef = useRef(null);
            const reduced = useReducedMotion();
            const scrollTo = useScrollTo();
            const [videoError, setVideoError] = useState(false);
            const [heroContent, setHeroContent] = useState({
                title: 'Your Future Starts Here',
                subtitle: 'Study abroad. Access opportunity. Build your future.',
                motto: 'Your Dreams. Our Pathway. Your Global Future.'
            });

            useEffect(() => {
                if (!supabaseClient) return;
                const loadSettings = async () => {
                    try {
                        const { data, error } = await supabaseClient.from('site_settings').select('key,value').in('key', ['hero_title','hero_subtitle','motto','hero_video_url','logo_url']);
                        if (error) throw error;
                        const map = {};
                        data.forEach(s => { map[s.key] = s.value; });
                        setHeroContent(prev => ({
                            ...prev,
                            title: map.hero_title || prev.title,
                            subtitle: map.hero_subtitle || prev.subtitle,
                            motto: map.motto || prev.motto
                        }));
                    } catch (err) { console.warn('Failed to load hero settings:', err); }
                };
                loadSettings();
            }, []);

            useEffect(() => {
                if (reduced) return;
                let ctx = null;
                try {
                    if (typeof gsap !== 'undefined' && typeof ScrollTrigger !== 'undefined') {
                        gsap.registerPlugin(ScrollTrigger);
                        ctx = gsap.context(() => {
                            gsap.to('.layer-foreground', { yPercent: 60, scale: 1.2, ease: 'none', scrollTrigger: { trigger: heroRef.current, start: 'top top', end: 'bottom top', scrub: true } });
                            gsap.to('.layer-typography', { yPercent: 30, opacity: 0, ease: 'none', scrollTrigger: { trigger: heroRef.current, start: 'top top', end: 'bottom top', scrub: true } });
                            gsap.to('.floating-shape', { yPercent: -30, ease: 'none', scrollTrigger: { trigger: heroRef.current, start: 'top top', end: 'bottom top', scrub: true } });
                        }, heroRef);
                    }
                } catch (err) { console.warn('GSAP animation init failed:', err); }
                return () => { if (ctx) ctx.revert(); };
            }, [reduced]);

            const heroVideoUrl = defaultMedia.heroVideo;

            return (
                <section id="home" ref={heroRef} className="relative h-screen overflow-hidden bg-navy" aria-label="Hero">
                    {!videoError ? (
                        <video className="hero-video" autoPlay muted loop playsInline preload="metadata" poster="" onError={() => setVideoError(true)}>
                            <source src={heroVideoUrl} type="video/mp4" />
                            Your browser does not support the video tag.
                        </video>
                    ) : (
                        <div className="hero-video" style={{ background: 'linear-gradient(135deg, #071A2F 0%, #0B2745 50%, #071A2F 100%)' }}></div>
                    )}
                    <div className="hero-overlay"></div>
                    <div className="absolute inset-0 layer-foreground" style={{ background: 'radial-gradient(circle at 70% 80%, rgba(34,211,238,0.2) 0%, transparent 50%)', zIndex: 2, pointerEvents: 'none' }}></div>
                    <div className="absolute inset-0 flex items-center justify-center layer-typography z-10" style={{ pointerEvents: 'none' }}>
                        <div className="text-center px-6" style={{ pointerEvents: 'auto' }}>
                            <Reveal delay={0.2}><p className="text-sm font-semibold uppercase tracking-[0.4em] text-sky mb-2">Elite Global Pathways</p></Reveal>
                            <Reveal delay={0.3}><p className="text-lg md:text-xl text-white/90 italic">{heroContent.motto}</p></Reveal>
                            <Reveal delay={0.5}><h1 className="text-5xl md:text-7xl lg:text-8xl font-bold text-white mt-6">{heroContent.title}</h1></Reveal>
                            <Reveal delay={0.7}><p className="mt-6 text-xl md:text-2xl text-sky-100/90">{heroContent.subtitle}</p></Reveal>
                            <Reveal delay={0.9} className="mt-10 flex flex-wrap items-center justify-center gap-4">
                                <WaterfillButton href="#apply" onClick={(e) => { e.preventDefault(); scrollTo('#apply'); }} className="rounded-full px-8 py-4 text-base font-semibold text-white bg-transparent border border-red" ariaLabel="Apply Now">Apply Now</WaterfillButton>
                                <WaterfillButton href="#programmes" onClick={(e) => { e.preventDefault(); scrollTo('#programmes'); }} className="rounded-full px-8 py-4 text-base font-semibold text-white bg-transparent border border-red" ariaLabel="Explore Our Programmes">Explore Our Programmes</WaterfillButton>
                            </Reveal>
                        </div>
                    </div>
                    <div className="absolute rounded-full filter blur-2xl opacity-30 floating-shape" style={{ width: 300, height: 300, background: 'rgba(56,189,248,0.15)', top: '-5%', left: '-5%', zIndex: 3, pointerEvents: 'none' }}></div>
                    <div className="absolute rounded-full filter blur-2xl opacity-30 floating-shape" style={{ width: 200, height: 200, background: 'rgba(34,211,238,0.1)', bottom: '-10%', right: '-5%', zIndex: 3, pointerEvents: 'none' }}></div>
                    <div className="absolute rounded-full filter blur-2xl opacity-30 floating-shape" style={{ width: 400, height: 400, background: 'rgba(7,26,47,0.3)', border: '2px solid rgba(255,255,255,0.05)', top: '30%', left: '60%', zIndex: 3, pointerEvents: 'none' }}></div>
                </section>
            );
        }

        function Destinations() {
            const { data: destinations, loading, error, retry } = useAsyncData(async () => {
                if (!supabaseClient) return [];
                try {
                    const data = await fetchDestinations();
                    if (!data || data.length === 0) return [];
                    // attempt to map images from storage or fallback
                    const media = await fetchMediaAssets();
                    const mediaMap = {};
                    if (media) {
                        media.forEach(m => {
                            if (m.storage_path) {
                                mediaMap[m.name] = m;
                            }
                        });
                    }
                    return data.map(dest => {
                        let imageUrl = null;
                        if (dest.image_url && dest.image_url.startsWith('http')) {
                            imageUrl = dest.image_url;
                        } else if (dest.name) {
                            const key = dest.name.toLowerCase().replace(/\s+/g, '-');
                            // try to find matching media asset by name pattern
                            const match = media.find(m => m.name.toLowerCase().includes(key) || (m.storage_path && m.storage_path.toLowerCase().includes(key)));
                            if (match) {
                                imageUrl = getMediaPublicUrl(match);
                            }
                        }
                        return { ...dest, imageUrl: imageUrl || null };
                    });
                } catch (err) {
                    console.warn('Destinations fetch failed:', err);
                    return [];
                }
            }, []);
            if (loading) return <MorphSection id="destinations" className="section-padding bg-navy"><div className="mx-auto max-w-6xl px-6 text-center"><p className="text-white/70">Loading destinations...</p></div></MorphSection>;
            if (error && (!destinations || destinations.length === 0)) return <MorphSection id="destinations" className="section-padding bg-navy"><div className="mx-auto max-w-6xl px-6 text-center"><p className="text-white/70">Destinations temporarily unavailable. Please try again.</p><button onClick={retry} className="btn-waterfill rounded-full px-6 py-2 mt-4 text-sm font-semibold text-white bg-transparent border border-red">Retry</button></div></MorphSection>;
            const list = destinations || [];
            return (
                <MorphSection id="destinations" className="section-padding bg-navy">
                    <div className="mx-auto max-w-6xl px-6 text-center">
                        <SectionHeading eyebrow="DESTINATIONS" title="Where Will Your Journey Take You?" subtitle="Explore potential study destinations, subject to programme availability and admission requirements." />

                                            <img src={d.imageUrl} alt={`${d.name} destination`} className="flag-img" loading="lazy" onError={(e) => { e.target.style.display = 'none'; }} />

                                            <div className="flag-img" style={{ background: 'var(--navy-2)' }}></div>
                                        )}

                                        {d.description && <p className="mt-2 text-sm text-white/60 line-clamp-2">{d.description}</p>}
                                    </div>
                                </Reveal>
                            ))}
                        </div>
                        <Reveal delay={0.5}><p className="mt-8 text-sm text-white/60">Programme availability varies by destination. We help you explore options that match your profile.</p></Reveal>
                    </div>
                </MorphSection>
            );

        function Programmes() {

                if (!supabaseClient) return [];
                try {
                    const data = await fetchProgrammes();

                    const media = await fetchMediaAssets();
                    const mediaMap = {};
                    if (media) {
                        media.forEach(m => {
                            if (m.storage_path) {
                                mediaMap[m.name] = m;
                            }
                        });
                    }
                    return data.map(prog => {
                        let imageUrl = prog.image_url;
                        if (imageUrl && !imageUrl.startsWith('http')) {
                            imageUrl = resolveStorageUrl(imageUrl) || imageUrl;
                        } else if (imageUrl && imageUrl.includes('imgur.com')) {
                            // try to find matching Supabase asset by name
                            const match = media.find(m => m.name.toLowerCase().includes(prog.title.toLowerCase()));
                            if (match) {
                                imageUrl = getMediaPublicUrl(match);
                            }
                        }
                        return { ...prog, imageUrl: imageUrl || null };
                    });

                    console.warn('Programmes fetch failed:', err);
                    return [];

                try {
                    return await fetchFaqs() || [];

                    console.warn('FAQ fetch failed:', err);
                    return [];
                }

            const defaultFaqs = [
                { id: '1', question: 'Do you guarantee scholarships?', answer: 'No. Scholarship awards are not guaranteed. Eligibility and final decisions are determined by the relevant institution or scholarship provider. We guide you through available opportunities and help you prepare strong applications.' },
                { id: '2', question: 'Is the half scholarship available to everyone?', answer: 'No. The approximate 50% tuition support is subject to eligibility, academic performance, programme requirements, university admission, availability, and deadlines.' },
                { id: '3', question: 'Does a 50% scholarship mean I pay nothing?', answer: 'No. A 50% tuition support typically reduces tuition fees by approximately half. You are still responsible for remaining tuition, accommodation, living expenses, travel, and other costs.' },
                { id: '4', question: 'Do you help with university applications?', answer: 'Yes. We assist with application preparation, document guidance, and follow-up with the university where applicable.' },
                { id: '5', question: 'Do you provide visa services?', answer: 'We provide general pre-departure guidance and information. Official visa applications must be handled through the relevant embassy or authorised visa service.' }

            const displayFaqs = (faqs && faqs.length > 0) ? faqs : defaultFaqs;
            if (loading) return <MorphSection id="faq" className="section-padding bg-navy"><div className="mx-auto max-w-3xl px-6 lg:px-8 text-center"><p className="text-white/70">Loading FAQs...</p></div></MorphSection>;
            if (error && displayFaqs.length === 0) return <MorphSection id="faq" className="section-padding bg-navy"><div className="mx-auto max-w-3xl px-6 lg:px-8 text-center"><p className="text-white/70">FAQs temporarily unavailable. Please try again.</p><button onClick={retry} className="btn-waterfill rounded-full px-6 py-2 mt-4 text-sm font-semibold text-white bg-transparent border border-red">Retry</button></div></MorphSection>;

                        <SectionHeading eyebrow="FAQ" title="Frequently Asked Questions" />
                        <div className="mt-12 space-y-4">
                            {displayFaqs.map(faq => {
                                const isOpen = openId === faq.id;
                                return (
                                    <div key={faq.id} className="border border-yellow/20 rounded-2xl overflow-hidden">
                                        <button
                                            className="flex w-full items-center justify-between gap-4 p-6 text-left text-white hover:bg-white/5 transition-colors"

                                            aria-controls={`faq-answer-${faq.id}`}

                                            <span className="text-lg font-semibold">{faq.question}</span>
                                            <span className="text-2xl" aria-hidden="true">{isOpen ? '−' : '+'}</span>

                                            <div id={`faq-answer-${faq.id}`} className="px-6 pb-6 text-white/70 leading-relaxed">
                                                {faq.answer}
                                            </div>
                                        )}
                                    </div>
                                );
                            })}
                        </div>
                    </div>
                </MorphSection>
            );
        }

        function ContactForm() {
            const [form, setForm] = useState({
                full_name: '', email: '', phone: '', country: '',
                academic_level: '', preferred_destination: '', preferred_programme: '',
                message: '', consent: false
            });
            const [submitting, setSubmitting] = useState(false);
            const [success, setSuccess] = useState(false);
            const [error, setError] = useState('');
            const [reference, setReference] = useState('');
            const [fieldErrors, setFieldErrors] = useState({});
            const successRef = useRef(null);
            const levels = ['Secondary School Graduate', 'Diploma/Certificate Holder', 'Undergraduate Graduate', 'Postgraduate Student', 'Working Professional'];
            const destinations = ['India', 'United Kingdom', 'Canada', 'United States', 'Australia', 'New Zealand', 'Europe', 'Not sure'];
            const programmes = ['Engineering & Technology', 'Health & Medical Sciences', 'Business & Management', 'Law & Public Administration', 'Social Sciences', 'Arts & Design', 'Humanities', 'Diploma/Certificate'];

            useEffect(() => { if (success && successRef.current) { successRef.current.focus(); } }, [success]);

            const handleChange = (e) => {
                const { name, value, type, checked } = e.target;
                setForm(prev => ({ ...prev, [name]: type === 'checkbox' ? checked : value }));
                if (fieldErrors[name]) { setFieldErrors(prev => ({ ...prev, [name]: null })); }
            };
            const validateEmail = (email) => /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);
            const validate = () => {
                const errors = {};
                if (!form.full_name.trim()) errors.full_name = 'Full name is required';
                if (!form.email.trim()) errors.email = 'Email is required';
                else if (!validateEmail(form.email)) errors.email = 'Please enter a valid email address';
                if (!form.consent) errors.consent = 'Please provide consent to submit your enquiry';
                return errors;
            };
            const generateReference = () => {
                const timestamp = Date.now().toString(36).toUpperCase();
                const random = Math.random().toString(36).substring(2, 6).toUpperCase();
                return `EGP-${timestamp}-${random}`;
            };
            const handleSubmit = async (e) => {
                e.preventDefault();
                setError('');
                const errors = validate();
                if (Object.keys(errors).length > 0) { setFieldErrors(errors); return; }
                setSubmitting(true);
                try {
                    if (!supabaseClient) throw new Error('Supabase not initialized');
                    const ref = generateReference();
                    const { error: submitError } = await supabaseClient
                        .from('enquiries')
                        .insert([{ ...form, status: 'new', source: 'website', reference: ref }]);
                    if (submitError) {
                        console.error('Submission error:', submitError);
                        setError('We couldn\'t submit your application right now. Your information has not been lost. Please try again.');
                        return;
                    }
                    setReference(ref);
                    setSuccess(true);
                    setForm({
                        full_name: '', email: '', phone: '', country: '',
                        academic_level: '', preferred_destination: '', preferred_programme: '',
                        message: '', consent: false
                    });
                } catch (err) {
                    console.error('Unexpected error:', err);
                    setError('Network error. Please check your connection and try again.');
                } finally {
                    setSubmitting(false);
                }
            };
            const resetForm = () => { setSuccess(false); setReference(''); setError(''); setFieldErrors({}); };

            return (
                <MorphSection id="apply" className="section-padding bg-navy">
                    <div className="mx-auto max-w-5xl px-6 lg:px-8">
                        <SectionHeading eyebrow="CONTACT & APPLICATION" title="Ready to Go Global?" subtitle="Tell us what you want to study and where you want to go." />
                        <div className="mt-16 grid gap-8 md:grid-cols-3">
                            <div className="md:col-span-2">
                                {success ? (
                                    <div ref={successRef} tabIndex={-1} className="rounded-3xl border border-green/30 bg-green/10 p-12 text-center" role="alert" aria-live="polite">
                                        <div className="text-6xl mb-4">✅</div>
                                        <h3 className="text-2xl font-bold text-white">Application Received!</h3>
                                        <p className="mt-2 text-white/70">Thank you for your enquiry.</p>
                                        {reference && <p className="mt-4 text-lg font-semibold text-yellow">Reference: {reference}</p>}
                                        <p className="mt-2 text-white/60">Our admissions guidance team will contact you soon.</p>
                                        <div className="mt-8 flex flex-wrap gap-4 justify-center">
                                            <button onClick={resetForm} className="btn-waterfill rounded-full px-6 py-3 text-sm font-semibold text-white bg-transparent border border-red">Submit Another Enquiry</button>
                                            <a href="https://wa.me/256779989906" target="_blank" rel="noopener noreferrer" className="btn-waterfill rounded-full px-6 py-3 text-sm font-semibold text-white bg-transparent border border-green">WhatsApp Our Team</a>
                                        </div>
                                    </div>
                                ) : (
                                    <form onSubmit={handleSubmit} className="space-y-6" noValidate>
                                        {error && (
                                            <div className="rounded-xl border border-red-500/30 bg-red-500/10 p-4 text-red-200" role="alert">
                                                {error}
                                                <button onClick={() => setError('')} className="ml-2 underline">Dismiss</button>
                                            </div>
                                        )}
                                        <div className="grid gap-6 md:grid-cols-2">
                                            <div>
                                                <label htmlFor="full_name" className="block text-sm font-medium text-white/80 mb-2">Full Name *</label>
                                                <input type="text" id="full_name" name="full_name" value={form.full_name} onChange={handleChange} required className="input-gold w-full rounded-xl px-5 py-3 text-white placeholder-white/40 focus:outline-none" placeholder="Your full name" aria-invalid={!!fieldErrors.full_name} />
                                                {fieldErrors.full_name && <p className="mt-1 text-sm text-red-400">{fieldErrors.full_name}</p>}
                                            </div>
                                            <div>
                                                <label htmlFor="email" className="block text-sm font-medium text-white/80 mb-2">Email *</label>
                                                <input type="email" id="email" name="email" value={form.email} onChange={handleChange} required className="input-gold w-full rounded-xl px-5 py-3 text-white placeholder-white/40 focus:outline-none" placeholder="you@example.com" aria-invalid={!!fieldErrors.email} />
                                                {fieldErrors.email && <p className="mt-1 text-sm text-red-400">{fieldErrors.email}</p>}
                                            </div>
                                            <div>
                                                <label htmlFor="phone" className="block text-sm font-medium text-white/80 mb-2">Phone Number</label>
                                                <input type="tel" id="phone" name="phone" value={form.phone} onChange={handleChange} className="input-gold w-full rounded-xl px-5 py-3 text-white placeholder-white/40 focus:outline-none" placeholder="+256 700 000 000" />
                                            </div>
                                            <div>
                                                <label htmlFor="country" className="block text-sm font-medium text-white/80 mb-2">Country</label>
                                                <input type="text" id="country" name="country" value={form.country} onChange={handleChange} className="input-gold w-full rounded-xl px-5 py-3 text-white placeholder-white/40 focus:outline-none" placeholder="Your country" />
                                            </div>
                                            <div>
                                                <label htmlFor="academic_level" className="block text-sm font-medium text-white/80 mb-2">Academic Level</label>
                                                <select id="academic_level" name="academic_level" value={form.academic_level} onChange={handleChange} className="select-gold w-full rounded-xl px-5 py-3 text-white focus:outline-none">
                                                    <option value="" disabled>Select level</option>
                                                    {levels.map(l => <option key={l} value={l}>{l}</option>)}
                                                </select>
                                            </div>
                                            <div>
                                                <label htmlFor="preferred_destination" className="block text-sm font-medium text-white/80 mb-2">Preferred Destination</label>
                                                <select id="preferred_destination" name="preferred_destination" value={form.preferred_destination} onChange={handleChange} className="select-gold w-full rounded-xl px-5 py-3 text-white focus:outline-none">
                                                    <option value="" disabled>Select destination</option>
                                                    {destinations.map(d => <option key={d} value={d}>{d}</option>)}
                                                </select>
                                            </div>
                                            <div>
                                                <label htmlFor="preferred_programme" className="block text-sm font-medium text-white/80 mb-2">Preferred Programme</label>
                                                <select id="preferred_programme" name="preferred_programme" value={form.preferred_programme} onChange={handleChange} className="select-gold w-full rounded-xl px-5 py-3 text-white focus:outline-none">
                                                    <option value="" disabled>Select programme</option>
                                                    {programmes.map(p => <option key={p} value={p}>{p}</option>)}
                                                </select>
                                            </div>
                                        </div>
                                        <div>
                                            <label htmlFor="message" className="block text-sm font-medium text-white/80 mb-2">Message</label>
                                            <textarea id="message" name="message" rows={4} value={form.message} onChange={handleChange} className="input-gold w-full rounded-xl px-5 py-3 text-white placeholder-white/40 focus:outline-none" placeholder="Tell us more..."></textarea>
                                        </div>
                                        <label className="flex items-start gap-3 text-sm text-white/80">
                                            <input type="checkbox" name="consent" checked={form.consent} onChange={handleChange} className="mt-1 h-5 w-5 rounded border-yellow bg-white/5 text-sky focus:ring-sky" aria-invalid={!!fieldErrors.consent} />
                                            <span>I consent to Elite Global Pathways processing my enquiry and understand that admission, scholarship, and visa outcomes are not guaranteed.</span>
                                        </label>
                                        {fieldErrors.consent && <p className="text-sm text-red-400">{fieldErrors.consent}</p>}
                                        <button type="submit" disabled={submitting} className="w-full rounded-xl px-8 py-3 text-lg font-semibold btn-waterfill bg-transparent border border-red text-white hover:shadow-lg hover:shadow-red/30 transition-shadow disabled:opacity-50 disabled:cursor-not-allowed" aria-label="Submit application">
                                            {submitting ? (
                                                <span className="flex items-center justify-center gap-2">
                                                    <svg className="animate-spin h-5 w-5" viewBox="0 0 24 24">
                                                        <circle cx="12" cy="12" r="10" stroke="currentColor" strokeWidth="4" fill="none" strokeDasharray="60" strokeDashoffset="20" />
                                                    </svg>
                                                    Submitting...
                                                </span>
                                            ) : (
                                                <>Submit Application <span className="ml-2">➤</span></>
                                            )}
                                        </button>
                                    </form>
                                )}
                            </div>
                            <div className="space-y-6">
                                <div className="glass rounded-2xl p-6 border border-yellow/20">
                                    <h3 className="text-xl font-semibold text-white mb-4">Direct Contact</h3>
                                    <ul className="space-y-3 text-sm text-white/80">
                                        <li><a href="mailto:eliteglobalpathwaysltd2025@gmail.com" className="hover:text-sky">📧 eliteglobalpathwaysltd2025@gmail.com</a></li>
                                        <li><a href="https://wa.me/917359320928" className="hover:text-sky">💬 WhatsApp India: +91 73593 20928</a></li>
                                        <li><a href="https://wa.me/256779989906" className="hover:text-sky">💬 WhatsApp Uganda: +256 779 989906</a></li>
                                        <li><a href="https://wa.me/9537875184" className="hover:text-sky">💬 WhatsApp Myanmar: +95 3787 5184</a></li>
                                    </ul>
                                </div>
                                <div className="glass rounded-2xl p-6 border border-yellow/20">
                                    <h3 className="text-xl font-semibold text-white mb-4">Important</h3>
                                    <p className="text-sm text-white/70 leading-relaxed">Elite Global Pathways does not guarantee admission, scholarship awards, or visa approval. All opportunities are subject to eligibility and institutional terms.</p>
                                </div>
                            </div>
                        </div>
                    </div>
                </MorphSection>
            );
        }

            return (
                <a href="https://wa.me/256779989906" target="_blank" rel="noopener noreferrer" className="whatsapp-float" aria-label="Chat on WhatsApp">
                    <svg viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg"><path d="M16.004 4C9.383 4 4 9.383 4 16.004c0 2.59.83 5.004 2.244 6.996L4 28l5.234-2.18A11.94 11.94 0 0 0 16.004 28c6.621 0 12.004-5.383 12.004-12.004C28.008 9.383 22.625 4 16.004 4zm0 2.4c5.305 0 9.604 4.3 9.604 9.604 0 5.305-4.3 9.604-9.604 9.604-2.121 0-4.076-.707-5.66-1.887l-.317-.191-3.777 1.57 1.57-3.777-.191-.317A9.57 9.57 0 0 1 6.4 16.004c0-5.305 4.3-9.604 9.604-9.604zm-3.9 4.79c-.16 0-.332.064-.507.28-.176.216-.664.65-.664 1.586 0 .937.683 1.842.777 1.969.094.128 1.304 2.155 3.293 2.934 1.647.646 1.982.516 2.34.484.357-.033 1.152-.47 1.314-.926.163-.456.163-.846.114-.926-.05-.08-.176-.127-.37-.223-.194-.095-1.152-.568-1.33-.632-.178-.065-.308-.095-.437.095-.13.19-.5.632-.613.761-.113.13-.226.145-.42.048-.194-.097-.82-.302-1.562-.963-.577-.514-.967-1.148-1.08-1.342-.113-.193-.012-.297.085-.393.087-.087.194-.227.291-.34.097-.114.13-.194.194-.323.065-.13.032-.242-.016-.339-.048-.097-.437-1.053-.6-1.441-.16-.38-.32-.329-.437-.334a7.7 7.7 0 0 0-.375-.007z"/></svg>
                </a>
            );
        }

        function AdminLogin({ onLogin }) {
            const [email, setEmail] = useState('');
            const [password, setPassword] = useState('');
            const [error, setError] = useState('');
            const [loading, setLoading] = useState(false);
            const handleSubmit = async (e) => {
                e.preventDefault();
                setLoading(true);
                setError('');
                try {
                    if (!supabaseClient) throw new Error('Supabase not initialized');
                    const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });
                    if (error) throw error;
                    onLogin();
                } catch (err) {
                    console.error('Login error:', err);
                    setError('Invalid credentials. Please try again.');
                } finally {
                    setLoading(false);
                }
            };
            return (
                <div className="min-h-screen flex items-center justify-center bg-navy px-4">
                    <div className="glass rounded-2xl p-8 w-full max-w-md">
                        <h1 className="text-2xl font-bold text-white mb-6">Admin Login</h1>
                        {error && <div className="mb-4 rounded-lg bg-red-500/20 p-3 text-red-200" role="alert">{error}</div>}
                        <form onSubmit={handleSubmit} className="space-y-4">
                            <div>
                                <label htmlFor="admin_email" className="block text-sm text-white/80 mb-2">Email</label>
                                <input type="email" id="admin_email" value={email} onChange={e => setEmail(e.target.value)} required className="input-gold w-full rounded-xl px-4 py-2" />
                            </div>
                            <div>
                                <label htmlFor="admin_password" className="block text-sm text-white/80 mb-2">Password</label>
                                <input type="password" id="admin_password" value={password} onChange={e => setPassword(e.target.value)} required className="input-gold w-full rounded-xl px-4 py-2" />
                            </div>
                            <button type="submit" disabled={loading} className="btn-waterfill w-full rounded-xl px-6 py-3 border border-red text-white font-semibold">
                                {loading ? 'Logging in...' : 'Login'}
                            </button>
                        </form>
                    </div>
                </div>
            );
        }

        function AdminDashboard({ onLogout }) {
            const [counts, setCounts] = useState({ programmes: 0, destinations: 0, faqs: 0, leads: 0, testimonials: 0 });
            const [loading, setLoading] = useState(true);
            useEffect(() => {
                const fetchCounts = async () => {
                    try {
                        if (!supabaseClient) return;
                        const queries = [
                            supabaseClient.from('programmes').select('id', { count: 'exact' }),
                            supabaseClient.from('destinations').select('id', { count: 'exact' }),
                            supabaseClient.from('faqs').select('id', { count: 'exact' }),
                            supabaseClient.from('enquiries').select('id', { count: 'exact' }),
                            supabaseClient.from('testimonials').select('id', { count: 'exact' })
                        ];
                        const results = await Promise.all(queries);
                        setCounts({
                            programmes: results[0].count || 0,
                            destinations: results[1].count || 0,
                            faqs: results[2].count || 0,
                            leads: results[3].count || 0,
                            testimonials: results[4].count || 0
                        });
                    } catch (err) {
                        console.error('Error fetching counts:', err);
                    } finally {
                        setLoading(false);
                    }
                };
                fetchCounts();
            }, []);
            const stats = [
                { label: 'Programmes', count: counts.programmes, icon: '📚' },
                { label: 'Destinations', count: counts.destinations, icon: '🌍' },
                { label: 'FAQs', count: counts.faqs, icon: '❓' },
                { label: 'Leads', count: counts.leads, icon: '📋' },
                { label: 'Testimonials', count: counts.testimonials, icon: '💬' }
            ];
            return (
                <div className="p-8 bg-navy min-h-screen">
                    <div className="flex justify-between items-center mb-8">
                        <h1 className="text-3xl font-bold text-white">Admin Dashboard</h1>
                        <button onClick={onLogout} className="px-4 py-2 bg-red-500/20 text-red-200 rounded-lg hover:bg-red-500/30">Logout</button>
                    </div>
                    {loading ? (
                        <p className="text-white/70">Loading dashboard...</p>
                    ) : (
                        <div className="grid gap-6 md:grid-cols-3 lg:grid-cols-5">
                            {stats.map(stat => (
                                <div key={stat.label} className="glass rounded-2xl p-6 text-center">
                                    <div className="text-3xl mb-2">{stat.icon}</div>
                                    <div className="text-3xl font-bold text-white">{stat.count}</div>
                                    <div className="text-sm text-white/70 mt-1">{stat.label}</div>
                                </div>
                            ))}
                        </div>
                    )}
                    <div className="mt-8">
                        <h2 className="text-xl font-semibold text-white mb-4">Quick Actions</h2>
                        <div className="flex flex-wrap gap-4">
                            <a href="#/admin/programmes" className="btn-waterfill rounded-full px-6 py-2 text-sm font-semibold text-white bg-transparent border border-red">Manage Programmes</a>
                            <a href="#/admin/leads" className="btn-waterfill rounded-full px-6 py-2 text-sm font-semibold text-white bg-transparent border border-red">View Leads</a>
                            <a href="#/admin/settings" className="btn-waterfill rounded-full px-6 py-2 text-sm font-semibold text-white bg-transparent border border-red">Site Settings</a>
                        </div>
                    </div>
                </div>
            );
        }

        function AdminSection({ title, children, onBack }) {
            return (
                <div className="p-8 bg-navy min-h-screen">
                    <div className="flex items-center gap-4 mb-8">
                        <button onClick={onBack} className="text-white/70 hover:text-white">← Back</button>
                        <h1 className="text-3xl font-bold text-white">{title}</h1>
                    </div>
                    {children}
                </div>
            );
        }

        function AdminProgrammes() {
            const { data: programmes, loading, error, retry } = useAsyncData(async () => {
                if (!supabaseClient) return [];
                const { data, error } = await supabaseClient.from('programmes').select('*').order('order_index');
                if (error) throw error;
                return data || [];
            }, []);
            const [editing, setEditing] = useState(null);
            const [showForm, setShowForm] = useState(false);
            const [formData, setFormData] = useState({ title: '', category: '', level: '', description: '', is_published: true, order_index: 0 });
            const handleSave = async () => {
                try {
                    if (!supabaseClient) return;
                    if (editing) {
                        await supabaseClient.from('programmes').update(formData).eq('id', editing.id);
                    } else {
                        await supabaseClient.from('programmes').insert([formData]);
                    }
                    setShowForm(false);
                    setEditing(null);
                    retry();
                } catch (err) {
                    console.error('Save error:', err);
                }
            };
            const handleDelete = async (id) => {
                if (window.confirm('Delete this programme?')) {
                    if (!supabaseClient) return;
                    await supabaseClient.from('programmes').delete().eq('id', id);
                    retry();
                }
            };
            if (loading) return <AdminSection title="Programmes" onBack={() => window.location.hash = '#/admin/dashboard'}><p className="text-white/70">Loading...</p></AdminSection>;
            return (
                <AdminSection title="Programmes" onBack={() => window.location.hash = '#/admin/dashboard'}>
                    <button onClick={() => { setShowForm(true); setEditing(null); setFormData({ title: '', category: '', level: '', description: '', is_published: true, order_index: 0 }); }} className="btn-waterfill rounded-full px-6 py-2 text-sm font-semibold text-white bg-transparent border border-red mb-4">Add Programme</button>
                    <div className="space-y-4">
                        {(programmes || []).map(p => (
                            <div key={p.id} className="glass rounded-2xl p-4 flex items-center justify-between">
                                <div>
                                    <h3 className="text-white font-semibold">{p.title}</h3>
                                    <p className="text-sm text-white/60">{p.category} | {p.level}</p>
                                </div>
                                <div className="flex gap-2">
                                    <button onClick={() => { setEditing(p); setFormData(p); setShowForm(true); }} className="text-sky hover:text-white">Edit</button>
                                    <button onClick={() => handleDelete(p.id)} className="text-red-400 hover:text-red-200">Delete</button>
                                </div>
                            </div>
                        ))}
                    </div>
                    {showForm && (
                        <div className="modal-overlay" role="dialog" aria-modal="true">
                            <div className="modal-content">
                                <button className="modal-close" onClick={() => setShowForm(false)}>✕</button>
                                <h3 className="text-xl font-bold text-white mb-4">{editing ? 'Edit Programme' : 'Add Programme'}</h3>
                                <div className="space-y-4">
                                    <input type="text" placeholder="Title" value={formData.title} onChange={e => setFormData({...formData, title: e.target.value})} className="input-gold w-full rounded-xl px-4 py-2" />
                                    <input type="text" placeholder="Category" value={formData.category || ''} onChange={e => setFormData({...formData, category: e.target.value})} className="input-gold w-full rounded-xl px-4 py-2" />
                                    <input type="text" placeholder="Level" value={formData.level || ''} onChange={e => setFormData({...formData, level: e.target.value})} className="input-gold w-full rounded-xl px-4 py-2" />
                                    <textarea placeholder="Description" value={formData.description || ''} onChange={e => setFormData({...formData, description: e.target.value})} className="input-gold w-full rounded-xl px-4 py-2" rows={4}></textarea>
                                    <label className="flex items-center gap-2 text-white/80 text-sm">
                                        <input type="checkbox" checked={formData.is_published} onChange={e => setFormData({...formData, is_published: e.target.checked})} />
                                        Published
                                    </label>
                                    <input type="number" placeholder="Order Index" value={formData.order_index || 0} onChange={e => setFormData({...formData, order_index: parseInt(e.target.value) || 0})} className="input-gold w-full rounded-xl px-4 py-2" />
                                    <button onClick={handleSave} className="btn-waterfill w-full rounded-xl px-6 py-2 border border-red text-white font-semibold">Save</button>
                                </div>
                            </div>
                        </div>
                    )}
                </AdminSection>
            );
        }

        function AdminLeads() {
            const { data: leads, loading, error, retry } = useAsyncData(async () => {
                if (!supabaseClient) return [];
                const { data, error } = await supabaseClient.from('enquiries').select('*').order('created_at', { ascending: false });
                if (error) throw error;
                return data || [];
            }, []);
            if (loading) return <AdminSection title="Leads" onBack={() => window.location.hash = '#/admin/dashboard'}><p className="text-white/70">Loading...</p></AdminSection>;
            return (
                <AdminSection title="Leads" onBack={() => window.location.hash = '#/admin/dashboard'}>
                    <div className="space-y-4">
                        {(leads || []).map(lead => (
                            <div key={lead.id} className="glass rounded-2xl p-4">
                                <div className="flex justify-between items-start">
                                    <div>
                                        <h3 className="text-white font-semibold">{lead.full_name}</h3>
                                        <p className="text-sm text-white/60">{lead.email} | {lead.phone || 'No phone'}</p>
                                        <p className="text-sm text-white/60">{lead.preferred_destination || 'No destination'} | {lead.preferred_programme || 'No programme'}</p>
                                        {lead.reference && <p className="text-xs text-yellow mt-1">Ref: {lead.reference}</p>}
                                    </div>
                                    <span className={`px-3 py-1 rounded-full text-xs ${lead.status === 'new' ? 'bg-blue-500/20 text-blue-200' : lead.status === 'contacted' ? 'bg-yellow-500/20 text-yellow-200' : 'bg-green-500/20 text-green-200'}`}>{lead.status || 'new'}</span>
                                </div>
                                {lead.message && <p className="mt-2 text-sm text-white/70">{lead.message}</p>}
                            </div>
                        ))}
                        {(!leads || leads.length === 0) && <p className="text-white/70">No leads yet.</p>}
                    </div>
                </AdminSection>
            );
        }

        function AdminSettings() {
            const { data: settings, loading, error, retry } = useAsyncData(async () => {
                if (!supabaseClient) return [];
                const { data, error } = await supabaseClient.from('site_settings').select('*');
                if (error) throw error;
                return data || [];
            }, []);
            const [formData, setFormData] = useState({});
            useEffect(() => {
                if (settings) {
                    const obj = {};
                    settings.forEach(s => { obj[s.key] = s.value; });
                    setFormData(obj);
                }
            }, [settings]);
            const handleSave = async () => {
                try {
                    if (!supabaseClient) return;
                    for (const [key, value] of Object.entries(formData)) {
                        await supabaseClient.from('site_settings').upsert({ key, value }, { onConflict: 'key' });
                    }
                    alert('Settings saved!');
                    retry();
                } catch (err) {
                    console.error('Save error:', err);
                }
            };
            if (loading) return <AdminSection title="Settings" onBack={() => window.location.hash = '#/admin/dashboard'}><p className="text-white/70">Loading...</p></AdminSection>;
            return (
                <AdminSection title="Site Settings" onBack={() => window.location.hash = '#/admin/dashboard'}>
                    <div className="space-y-4 max-w-lg">
                        {Object.entries(formData).map(([key, value]) => (
                            <div key={key}>
                                <label className="block text-sm text-white/80 mb-1">{key}</label>
                                <input type="text" value={value || ''} onChange={e => setFormData({...formData, [key]: e.target.value})} className="input-gold w-full rounded-xl px-4 py-2" />
                            </div>
                        ))}
                        <button onClick={handleSave} className="btn-waterfill rounded-xl px-6 py-3 border border-red text-white font-semibold w-full">Save Settings</button>
                    </div>
                </AdminSection>
            );
        }

        function AdminLayout() {
            const [session, setSession] = useState(null);
            const [route, setRoute] = useState(window.location.hash);
            useEffect(() => {
                const checkSession = async () => {
                    try {
                        if (!supabaseClient) return;
                        const { data } = await supabaseClient.auth.getSession();
                        setSession(data.session);
                    } catch (err) {
                        console.error('Session check error:', err);
                        setSession(null);
                    }
                };
                checkSession();
                if (supabaseClient) {
                    const { data: authListener } = supabaseClient.auth.onAuthStateChange((_event, session) => {
                        setSession(session);
                    });
                    const hashHandler = () => setRoute(window.location.hash);
                    window.addEventListener('hashchange', hashHandler);
                    return () => {
                        if (authListener?.subscription) authListener.subscription.unsubscribe();
                        window.removeEventListener('hashchange', hashHandler);
                    };
                } else {
                    const hashHandler = () => setRoute(window.location.hash);
                    window.addEventListener('hashchange', hashHandler);
                    return () => window.removeEventListener('hashchange', hashHandler);
                }
            }, []);
            const handleLogout = async () => {
                try {
                    if (supabaseClient) await supabaseClient.auth.signOut();
                } catch (err) {
                    console.error('Logout error:', err);
                }
                setSession(null);
                window.location.hash = '#/admin/login';
            };
            if (!session) {
                return <AdminLogin onLogin={() => { if (supabaseClient) { supabaseClient.auth.getSession().then(({ data }) => { setSession(data.session); window.location.hash = '#/admin/dashboard'; }); } }} />;
            }
            const renderRoute = () => {
                switch (route) {
                    case '#/admin/dashboard': return <AdminDashboard onLogout={handleLogout} />;
                    case '#/admin/programmes': return <AdminProgrammes />;
                    case '#/admin/leads': return <AdminLeads />;
                    case '#/admin/settings': return <AdminSettings />;
                    case '#/admin/cms': return <AdminSection title="CMS" onBack={() => window.location.hash = '#/admin/dashboard'}><p className="text-white/70">CMS management coming soon.</p></AdminSection>;
                    case '#/admin/media': return <AdminSection title="Media" onBack={() => window.location.hash = '#/admin/dashboard'}><p className="text-white/70">Media management coming soon.</p></AdminSection>;
                    case '#/admin/destinations': return <AdminSection title="Destinations" onBack={() => window.location.hash = '#/admin/dashboard'}><p className="text-white/70">Destination management coming soon.</p></AdminSection>;
                    case '#/admin/services': return <AdminSection title="Services" onBack={() => window.location.hash = '#/admin/dashboard'}><p className="text-white/70">Service management coming soon.</p></AdminSection>;
                    case '#/admin/journey': return <AdminSection title="Journey Steps" onBack={() => window.location.hash = '#/admin/dashboard'}><p className="text-white/70">Journey management coming soon.</p></AdminSection>;
                    case '#/admin/faqs': return <AdminSection title="FAQs" onBack={() => window.location.hash = '#/admin/dashboard'}><p className="text-white/70">FAQ management coming soon.</p></AdminSection>;
                    case '#/admin/testimonials': return <AdminSection title="Testimonials" onBack={() => window.location.hash = '#/admin/dashboard'}><p className="text-white/70">Testimonial management coming soon.</p></AdminSection>;
                    case '#/admin/login': return null;
                    default: return <AdminDashboard onLogout={handleLogout} />;
                }
            };
            return renderRoute();
        }

        function App() {
            const [route, setRoute] = useState(window.location.hash);
            const [splashDone, setSplashDone] = useState(false);
            useEffect(() => {
                const handler = () => setRoute(window.location.hash);
                window.addEventListener('hashchange', handler);
                return () => window.removeEventListener('hashchange', handler);
            }, []);
            const isAdminRoute = route.startsWith('#/admin');
            return (
                <ErrorBoundary>
                    <SmoothScroll>
                        {!splashDone && !isAdminRoute && <SplashScreen onComplete={() => setSplashDone(true)} />}
                        {isAdminRoute ? (
                            <AdminLayout />
                        ) : (
                            <>
                                <a href="#main-content" className="skip-link">Skip to main content</a>
                                <Navbar />
                                <main id="main-content">
                                    <ParallaxHero />
                                    <Destinations />
                                    <Programmes />
                                    <Support />
                                    <HowItWorks />
                                    <WhyChooseUs />
                                    <Testimonials />
                                    <FAQ />
                                    <ContactForm />
                                </main>
                                <Footer />
                                <WhatsAppFloat />
                            </>
                        )}
                    </SmoothScroll>
                </ErrorBoundary>
            );
        }

        const rootElement = document.getElementById('root');
        if (rootElement) {
            ReactDOM.render(<App />, rootElement);
        } else {
            console.error('Root element not found');
        }
    </script>
</body>
</html>
